<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Highlights</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <label class="search">
        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Search highlights, notes, pages…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search highlights"
        />
      </label>
      <div class="menu-wrap">
        <button id="menu-button" class="icon-button" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false">
          <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h.01" /><path d="M12 12h.01" /><path d="M19 12h.01" />
          </svg>
        </button>
        <div id="menu" class="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-command="export">Export highlights (JSON)</button>
          <button type="button" role="menuitem" data-command="import-merge">Import and merge…</button>
          <button type="button" role="menuitem" data-command="import-replace">Import and replace everything…</button>
        </div>
      </div>
    </header>

    <div id="access" class="confirm notice" role="region" aria-label="Website access" hidden></div>
    <div id="confirm" class="confirm" role="alertdialog" hidden></div>
    <section id="current" class="current" aria-label="This page" hidden></section>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Browse">
      <button type="button" role="tab" data-tab="sites" aria-selected="true">Sites</button>
      <button type="button" role="tab" data-tab="groups" aria-selected="false">Groups</button>
      <button type="button" role="tab" data-tab="recent" aria-selected="false">Recent</button>
    </nav>

    <main id="view" class="view"></main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <input id="file" type="file" accept=".json,application/json" hidden />
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
